---
services:
  couchdb:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # the image creates the admin account from these on first boot. It creates
    # no database, which is what the post create hook is for.
    environment:
      COUCHDB_DBNAME: "{{ .Database }}"
      COUCHDB_PASSWORD: "{{ .Secret.password }}"
      COUCHDB_USER: "{{ .ServiceName }}"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /opt/couchdb/etc/local.d
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /opt/couchdb/data

    ports:
      - name: native
        target: 5984
        primary: true

x-dokku:
  plugin: couchdb
  title: CouchDB

  # http rather than couchdb: a linked app talks to it over http, and this is
  # the scheme the bash plugin has always handed over
  scheme: http
  alias: COUCHDB

  dsn: "{{ .Scheme }}://{{ .Username }}:{{ .Password }}@{{ .Host }}:{{ .Port.native }}/{{ .Database }}"
  wait: native

  # the databases and users a service holds beside its own, made beside the
  # service for the reason the dumps are. A user is a member of every database
  # the service holds rather than an admin, so it reaches nothing the server
  # keeps for itself.
  databases:
    create:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-create-database"]
      env:
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"
        COUCHDB_DATABASE: "{{ .Args.database }}"
        COUCHDB_MEMBERS: "{{ .Args.users }}"
    destroy:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-destroy-database"]
      env:
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"
        COUCHDB_DATABASE: "{{ .Args.database }}"

  users:
    default: "{{ .ServiceName }}"
    secret: password
    reserved: [admin]
    create:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-users", "create"]
      env:
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"
        COUCHDB_USER_NAME: "{{ .Args.user }}"
        COUCHDB_DATABASES: "{{ .Args.databases }}"
        COUCHDB_NEW_PASSWORD: "{{ .NewSecret }}"
    destroy:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-users", "destroy"]
      env:
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"
        COUCHDB_USER_NAME: "{{ .Args.user }}"
        COUCHDB_DATABASES: "{{ .Args.databases }}"
    change:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-users", "change"]
      env:
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"
        COUCHDB_USER_NAME: "{{ .Args.user }}"
        COUCHDB_NEW_PASSWORD: "{{ .NewSecret }}"


  secrets:
    password:
      file: PASSWORD
      length: 64
      env: SERVICE_PASSWORD

      # the image only writes the admin account into the server's config when
      # it has none, so the account is given its new password through the
      # server's own config api, which writes it back to the same file. Beside
      # the service for the reason the dumps are.
      change:
        mode: sidecar
        image: dokku/s3backup:0.20.0
        exec: ["dokku-couchdb-change-password"]
        env:
          COUCHDB_USER: "{{ .ServiceName }}"
          COUCHDB_PASSWORD: "{{ .Secret.password }}"
          COUCHDB_NEW_PASSWORD: "{{ .NewSecret }}"

  hooks:
    post_create:
      # beside the service rather than inside it, for the same reason the dumps
      # are: the couchdb image ships nothing that can read json
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-create-database"]
      env:
        COUCHDB_DATABASE: "{{ .Database }}"
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"

  commands:
    # no connect: couchdb speaks http and ships no client to connect with. The
    # bash plugin advertises the command and fails with "Not yet implemented",
    # which deriving what a datastore can do from what it declares fixes.

    # both dumps run beside the service, in an image dokku already ships that
    # has python. The couchdb image has no jq, no python and not even perl's
    # own json module, which is why the bash plugin downloads a third party
    # script into the running container, from a branch rather than a tag, on
    # every export and import.
    export:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-export"]
      env:
        COUCHDB_DATABASE: "{{ .Database }}"
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"

      # every database, keyed by name, leaving out the ones the server keeps
      # for itself. The service's account is the server's admin, so it can
      # read every one.
      all_databases:
        mode: sidecar
        image: dokku/s3backup:0.20.0
        exec: ["dokku-couchdb-export"]
        env:
          COUCHDB_ALL_DATABASES: "true"
          COUCHDB_DATABASE: "{{ .Database }}"
          COUCHDB_USER: "{{ .ServiceName }}"
          COUCHDB_PASSWORD: "{{ .Secret.password }}"

    import:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      stdin: true
      exec: ["dokku-couchdb-import"]
      env:
        COUCHDB_DATABASE: "{{ .Database }}"
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"

      # each database in the dump is replaced under the name it was exported
      # from, and any the dump does not name is left alone
      all_databases:
        mode: sidecar
        image: dokku/s3backup:0.20.0
        stdin: true
        exec: ["dokku-couchdb-import"]
        env:
          COUCHDB_ALL_DATABASES: "true"
          COUCHDB_DATABASE: "{{ .Database }}"
          COUCHDB_USER: "{{ .ServiceName }}"
          COUCHDB_PASSWORD: "{{ .Secret.password }}"

    # beside the service for the same reason the dumps are. Every database an
    # app could have written to goes, but for the ones made in the service, and
    # the service's own is made again
    reset:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-couchdb-reset"]
      env:
        COUCHDB_DATABASE: "{{ .Database }}"
        COUCHDB_DEFAULT_DATABASE: "{{ .DefaultDatabase }}"
        COUCHDB_DATABASES: "{{ .Args.databases }}"
        COUCHDB_USER: "{{ .ServiceName }}"
        COUCHDB_PASSWORD: "{{ .Secret.password }}"

  # the databases the server keeps for itself. A service named after one would
  # hand its app the server's own database rather than one of its own
  reserved_names: [_global_changes, _replicator, _users]
